<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Biswajit Pain{% endblock %}</title>
  <meta name="author" content="Biswajit Pain">
  <meta name="description" content="{% block description %}Systems Development Engineer — Resume{% endblock %}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" media="screen">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}" media="print">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="site-nav no-print">
    <div class="nav-inner">
      <a class="nav-brand" href="{{ url_for('index') }}">Biswajit Pain</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}" {% if request.path == '/' %}class="active"{% endif %}>Resume</a>
        <a href="{{ url_for('generate') }}" {% if request.path == '/generate' %}class="active"{% endif %}>Generate with AI</a>
        <a href="{{ url_for('download_txt') }}">Plain Text</a>
        <a href="{{ url_for('download_pdf') }}" class="btn btn-ghost btn-sm">PDF</a>
        <a href="{{ url_for('download_docx') }}" class="btn btn-outline btn-sm">Download DOCX</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer no-print">
    <div class="footer-inner">
      <span>Biswajit Pain &mdash; Systems Development Engineer &mdash; Berlin</span>
    </div>
  </footer>
</body>
</html>
