name: Build & Deploy

on:
  push:
    branches: [ base ]
  pull_request:
    branches: [ base ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build static site and deploy to gh-pages
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Lint (errors only)
        run: |
          flake8 app.py build.py --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Build static site
        env:
          STATIC_BUILD: "true"
          ANTHROPIC_API_KEY: "build-placeholder"
        run: python build.py

      - name: Verify build artefacts
        run: |
          echo "── _site contents ──────────────────────────"
          find _site -type f | sort
          echo "────────────────────────────────────────────"
          test -f _site/index.html
          test -f _site/resume.pdf
          test -f _site/resume.txt
          test -f _site/.nojekyll
          test -f _site/static/css/style.css
          echo "All required files present."

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/base' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

          cd _site
          git init
          git add -A
          git commit -m "Deploy $(date -u +'%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::8}"
          git branch -M gh-pages
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages
